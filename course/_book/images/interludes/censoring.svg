<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <line x1="480" y1="34" x2="480" y2="240" stroke="#0b0b0b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="480" y="24" fill="#0b0b0b" text-anchor="middle">observation horizon</text>
  <line x1="100" y1="66" x2="200" y2="66" stroke="#2a78d6" stroke-width="2.5"/><circle cx="100" cy="66" r="4.5" fill="#2a78d6"/><circle cx="200" cy="66" r="4.5" fill="none" stroke="#2a78d6" stroke-width="2"/><line x1="260" y1="57" x2="260" y2="75" stroke="#0b0b0b" stroke-width="1.6"/><text x="260" y="52" fill="#52514e" font-size="11" text-anchor="middle">deadline</text><text x="60" y="88" fill="#52514e" font-size="12">fulfilled before its deadline — on time</text><line x1="200" y1="122" x2="360" y2="122" stroke="#2a78d6" stroke-width="2.5"/><circle cx="200" cy="122" r="4.5" fill="#2a78d6"/><line x1="360" y1="113" x2="360" y2="131" stroke="#0b0b0b" stroke-width="1.6"/><text x="360" y="108" fill="#52514e" font-size="11" text-anchor="middle">deadline</text><text x="60" y="144" fill="#52514e" font-size="12">deadline observed passing unfulfilled — late, and that verdict is final</text><line x1="390" y1="178" x2="480" y2="178" stroke="#2a78d6" stroke-width="2.5"/><circle cx="390" cy="178" r="4.5" fill="#2a78d6"/><line x1="480" y1="178" x2="526" y2="178" stroke="#2a78d6" stroke-width="2" stroke-dasharray="2 5"/><text x="60" y="200" fill="#52514e" font-size="12">deadline beyond the horizon — unresolved: not on time, not late</text>
