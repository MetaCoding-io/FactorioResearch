spec: fisl/v1

scenario:
  id: fp-sandbox
  version: 0.1.0
  title: Operator Training
  description: >-
    The practice range. Lab 0's one-machine world with a toolbox stocked
    for every manipulation the course uses: belts, chests, an upgrade
    machine, combinators. Build the drills on the READY floor at your own
    pace, then press Start Experiment for a one-minute inspection pass —
    the post-run report grades the drills and shows a real (tiny)
    measurement of the line you may have just rebuilt. Nothing here is an
    experiment; everything here is rehearsal for one.

factorio:
  version:
    minimum: 2.0.77
    maximum_exclusive: 2.1.0
  baseline_save: baseline.zip
  required_mods:
    fisl-core: compatible
    fisl-factory-physics: compatible

experiment:
  seed: 1
  time:
    game_speed:
      policy: fixed
      value: 1.0
    pause_policy: prohibited
  phases:
    - id: warmup
      duration: 15s
    - id: measured
      duration: 45s

zones:
  factory_floor:
    surface: nauvis
    area:
      left_top: [-18, -16]
      right_bottom: [18, 16]

systems:
  factory:
    primary_zone: factory_floor
    boundary_integrity:
      entity_containment: flag

entity_sets:
  line_machines:
    zone: factory_floor
    types:
      - assembling-machine
    exclude_roles:
      - fisl_apparatus
    membership: dynamic

ports:
  workpiece_source:
    system: factory
    direction: source
    binding:
      surface: nauvis
      position: [-12.5, 0.5]
      prototype: fisl-source-port
    material:
      item: fisl-rough-workpiece
    supply:
      mode: replenish
      target: 100

  finished_goods:
    system: factory
    direction: sink
    binding:
      surface: nauvis
      position: [13.5, 0.5]
      prototype: fisl-sink-port
    material:
      item: fisl-machined-workpiece

flows:
  workpiece_flow:
    system: factory
    unit: workpiece
    basis:
      type: conserved_work_unit
      materials:
        fisl-rough-workpiece: 1
        fisl-machined-workpiece: 1
    entry_ports:
      - workpiece_source
    completion_ports:
      - finished_goods

metrics:
  line_wip:
    type: wip
    flow: workpiece_flow
    method: conservation_ledger
    validation:
      physical_census:
        required: true
        every: 60t
        discrepancy_tolerance: 0
        include_player_inventory: true

  current_wip:
    type: current_value
    source: line_wip

  average_wip:
    type: aggregate
    source: line_wip
    aggregation: time_mean
    window:
      phase: measured

  measured_throughput:
    type: throughput
    flow: workpiece_flow
    window:
      phase: measured
    display_unit: workpieces_per_minute

  machine_state:
    type: production_state
    entities: line_machines
    adapter: crafting_machine

  fraction_productive:
    type: state_fraction
    source: machine_state
    state: productive
    entity_aggregation: pooled_machine_time
    denominator: full_window
    window:
      phase: measured

visibility:
  learner_live:
    metrics:
      - current_wip
  learner_post_run:
    metrics:
      - average_wip
      - measured_throughput
      - fraction_productive
  instructor:
    metrics:
      - line_wip
      - machine_state
    diagnostics:
      - coverage
      - census
      - protocol_violations

learning:
  concepts:
    - game manipulation skills (belts, splices, swaps, wires)
    - the READY floor as unmeasured practice space
    - reading a run report
  represents_directly:
    - every build primitive later labs require, in a consequence-free world
  remains_absent:
    - experimental stakes
    - optimization pressure
  not_warranted:
    - treating drill verdicts as measurements — drills grade practice,
      and are deliberately outside the metrics pipeline
