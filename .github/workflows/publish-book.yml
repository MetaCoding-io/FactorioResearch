# Deploys the committed rendered book (course/_book) to GitHub Pages.
# It publishes exactly the reviewed snapshot, so CI needs no Quarto
# toolchain: render + commit course/_book, and this workflow ships it.
name: Publish course book

on:
  push:
    branches: [main]
    paths:
      - "course/_book/**"
      - ".github/workflows/publish-book.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: course/_book
      - id: deployment
        uses: actions/deploy-pages@v4
